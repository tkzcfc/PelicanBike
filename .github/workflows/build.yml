# Build PelicanBike with the official axmol engine (release/2.x) for Windows / macOS / Android / Web,
# attach the packages to the GitHub Release on v* tags and deploy the web build to GitHub Pages.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AXMOL_REPO: https://github.com/axmolengine/axmol
  AXMOL_BRANCH: release/2.x
  GH_XCODE_VER: '16.4'

jobs:
  # ---------------------------------------------------------------- native
  native:
    # pushes to main only rebuild the web version (Pages); tags and manual runs build everything
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            os: windows-latest
            arch: x64
            artifact: PelicanBike-windows-x64.zip
          - platform: osx
            os: macos-15
            arch: arm64
            artifact: PelicanBike-macos.zip
          - platform: android
            os: ubuntu-latest
            arch: arm64
            artifact: PelicanBike-android.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'osx'
        with:
          xcode-version: ${{ env.GH_XCODE_VER }}

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: microsoft
          java-version: '17'

      - name: Resolve engine revision
        id: axmol
        shell: bash
        run: |
          sha=$(git ls-remote "$AXMOL_REPO" "refs/heads/$AXMOL_BRANCH" | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_WORKSPACE/axmol" >> "$GITHUB_OUTPUT"

      - name: Cache engine + toolchains
        uses: actions/cache@v4
        with:
          path: ${{ steps.axmol.outputs.dir }}
          key: axmol-${{ matrix.platform }}-${{ runner.os }}-${{ steps.axmol.outputs.sha }}
          restore-keys: axmol-${{ matrix.platform }}-${{ runner.os }}-

      - name: Fetch engine (release/2.x)
        shell: bash
        run: |
          d="${{ steps.axmol.outputs.dir }}"
          if [ -d "$d/.git" ]; then
            git -C "$d" fetch --depth 1 origin "$AXMOL_BRANCH" && git -C "$d" reset --hard FETCH_HEAD
          else
            rm -rf "$d" && git clone --depth 1 -b "$AXMOL_BRANCH" "$AXMOL_REPO" "$d"
          fi
          git -C "$d" log -1 --format='axmol %h %ci %s'
          echo "AX_ROOT=$d" >> "$GITHUB_ENV"

      - name: Engine setup
        shell: pwsh
        run: |
          Set-Location $env:AX_ROOT
          if ($IsLinux) { 'y' | ./setup.ps1 } else { ./setup.ps1 }

      - name: Android keystore (optional)
        if: matrix.platform == 'android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No keystore secret: the release APK is signed with the debug key"
          fi

      - name: Build + package
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./tools/ci/build.ps1 -Platform ${{ matrix.platform }} -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------- web
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve engine revision
        id: axmol
        shell: bash
        run: |
          sha=$(git ls-remote "$AXMOL_REPO" "refs/heads/$AXMOL_BRANCH" | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_WORKSPACE/axmol" >> "$GITHUB_OUTPUT"

      - name: Cache engine + emsdk
        uses: actions/cache@v4
        with:
          path: ${{ steps.axmol.outputs.dir }}
          key: axmol-wasm-${{ runner.os }}-${{ steps.axmol.outputs.sha }}
          restore-keys: axmol-wasm-${{ runner.os }}-

      - name: Fetch engine (release/2.x)
        shell: bash
        run: |
          d="${{ steps.axmol.outputs.dir }}"
          if [ -d "$d/.git" ]; then
            git -C "$d" fetch --depth 1 origin "$AXMOL_BRANCH" && git -C "$d" reset --hard FETCH_HEAD
          else
            rm -rf "$d" && git clone --depth 1 -b "$AXMOL_BRANCH" "$AXMOL_REPO" "$d"
          fi
          git -C "$d" log -1 --format='axmol %h %ci %s'
          echo "AX_ROOT=$d" >> "$GITHUB_ENV"

      - name: Engine setup
        shell: pwsh
        run: |
          Set-Location $env:AX_ROOT
          'y' | ./setup.ps1

      - name: Build + package (AX_WASM_THREADS=0, no COOP/COEP needed)
        shell: pwsh
        run: ./tools/ci/build.ps1 -Platform wasm

      - uses: actions/upload-artifact@v4
        with:
          name: PelicanBike-web.zip
          path: dist/PelicanBike-web.zip
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist/PelicanBike-web

  # ---------------------------------------------------------------- pages
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PelicanBike-windows-x64.zip
            artifacts/PelicanBike-macos.zip
            artifacts/PelicanBike-android.apk
            artifacts/PelicanBike-web.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
